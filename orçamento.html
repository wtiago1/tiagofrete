<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <title>Orçamento</title>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4 text-center">Selecione uma data disponível</h2>
        <div id="calendario" class="mb-6"></div>

        <form id="form-orcamento" class="hidden border-t pt-4 space-y-3">
            <h3 id="txt-data" class="font-bold text-blue-600"></h3>
            <input type="hidden" id="data-selecionada">
            
            <input type="text" id="nome" placeholder="Seu Nome" required class="w-full p-2 border rounded">
            <input type="text" id="saida" placeholder="Endereço de Coleta" required class="w-full p-2 border rounded">
            <input type="text" id="entrega" placeholder="Endereço de Entrega" required class="w-full p-2 border rounded">
            
            <select id="ajudante" class="w-full p-2 border rounded">
                <option value="Sem Ajudante">Precisa de Ajudante? Não</option>
                <option value="Com Ajudante">Precisa de Ajudante? Sim</option>
            </select>
            
            <textarea id="obs" placeholder="Descreva o que vai transportar..." required class="w-full p-2 border rounded"></textarea>
            
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-bold">Solicitar Orçamento</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDqHHQ1uzScfN09vJgvmuHnYnPCyV5_mPo", authDomain: "tiago-frete.firebaseapp.com", projectId: "tiago-frete", storageBucket: "tiago-frete.firebasestorage.app", messagingSenderId: "229105333833", appId: "1:229105333833:web:7791e40bdb613c6711f198" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const calendarEl = document.getElementById('calendario');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'pt-br',
            dateClick: (info) => {
                document.getElementById('form-orcamento').classList.remove('hidden');
                document.getElementById('data-selecionada').value = info.dateStr;
                document.getElementById('txt-data').innerText = "Data: " + info.dateStr.split('-').reverse().join('/');
            }
        });
        calendar.render();

        // Carrega cores da Agenda (Index)
        db.collection("horarios_livres").onSnapshot(snap => {
            calendar.removeAllEvents();
            snap.forEach(doc => {
                calendar.addEvent({ title: 'Livre', start: doc.data().data, allDay: true, backgroundColor: '#10B981' });
            });
        });

        document.getElementById('form-orcamento').onsubmit = (e) => {
            e.preventDefault();
            db.collection("fretes").add({
                nome: document.getElementById('nome').value,
                data: document.getElementById('data-selecionada').value,
                saida: document.getElementById('saida').value,
                entrega: document.getElementById('entrega').value,
                ajudante: document.getElementById('ajudante').value,
                observacao: document.getElementById('obs').value,
                status: 'Pendente'
            }).then(() => { alert("Orçamento enviado!"); location.reload(); });
        };
    </script>
</body>
</html>

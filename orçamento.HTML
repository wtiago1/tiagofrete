<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Orçamento de Frete / Mudança</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-6 sm:p-8">
        <div class="text-center mb-6">
            <div class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fas fa-file-invoice-dollar text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Solicitar Orçamento</h2>
            <p class="text-sm text-gray-400 mt-1">Preencha os dados abaixo para calcularmos o valor do seu frete ou mudança.</p>
        </div>
        
        <form id="form-cliente-orcamento" onsubmit="enviarOrcamento(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Seu Nome *</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">WhatsApp / Celular *</label>
                    <input type="tel" id="telefone" required placeholder="(19) 99999-9999" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Tipo de Local</label>
                    <select id="tipoLocal" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
                        <option value="Casa">Casa</option>
                        <option value="Apartamento">Apartamento</option>
                        <option value="Diversos">Comercial / Outros</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Vai precisar de ajudante?</label>
                    <select id="ajudante" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
                        <option value="Sem Ajudante">Não (Apenas o motorista)</option>
                        <option value="Com Ajudante">Sim (Motorista + Ajudante)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Endereço de Saída (Origem) *</label>
                <input type="text" id="saida" required placeholder="Rua, número, bairro e cidade" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Endereço de Entrega (Destino) *</label>
                <input type="text" id="entrega" required placeholder="Rua, número, bairro e cidade" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">O que precisa transportar? (Lista de Itens) *</label>
                <textarea id="observacao" rows="4" required placeholder="Ex: 1 Geladeira, 1 Sofá 3 lugares, 5 caixas médias, 1 cama de casal..." class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-blue-500"></textarea>
            </div>

            <button type="submit" id="btn-enviar" class="w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold transition shadow-lg flex items-center justify-center">
                <i class="fas fa-paper-plane mr-2"></i>Enviar Pedido de Orçamento
            </button>
        </form>

        <div id="msg-sucesso" class="hidden text-center py-8 space-y-3">
            <i class="fas fa-check-circle text-green-500 text-5xl"></i>
            <h3 class="text-xl font-bold text-white">Pedido Enviado com Sucesso!</h3>
            <p class="text-gray-400 text-sm px-4">Obrigado! Recebemos as suas informações. Vamos analisar o trajeto e os itens e entraremos em contato pelo WhatsApp em breve.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // Mesma configuração de banco que você já usa
        const firebaseConfig = {
            apiKey: "AIzaSyDqHHQ1uzScfN09vJgvmuHnYnPCyV5_mPo",
            authDomain: "tiago-frete.firebaseapp.com",
            projectId: "tiago-frete",
            storageBucket: "tiago-frete.firebasestorage.app",
            messagingSenderId: "229105333833",
            appId: "1:229105333833:web:7791e40bdb613c6711f198",
            measurementId: "G-XJMGGL3NTK"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function enviarOrcamento(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Enviando...`;

            // Monta os dados enviados pelo cliente
            const pedidoOrcamento = {
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                tipoLocal: document.getElementById('tipoLocal').value,
                ajudante: document.getElementById('ajudante').value,
                saida: document.getElementById('saida').value,
                entrega: document.getElementById('entrega').value,
                observacao: document.getElementById('observacao').value,
                
                // Define valores padrão de custo e preço zerados para você preencher depois
                valor: 0,
                custo_gasolina: 0,
                custo_ajudante: 0,
                custo_pedagio: 0,
                custo_manutencao: 0,
                obs_manutencao: "",
                
                // Entra automaticamente como Pendente no seu painel
                status: "Pendente",
                data: new Date().toISOString().split('T')[0], // Define a data de hoje por padrão
                criadoEm: new Date().toISOString()
            };

            db.collection("fretes").add(pedidoOrcamento)
            .then(() => {
                // Oculta o formulário e mostra a mensagem de sucesso
                document.getElementById('form-cliente-orcamento').classList.add('hidden');
                document.getElementById('msg-sucesso').classList.remove('hidden');
            })
            .catch((error) => {
                console.error("Erro ao enviar: ", error);
                alert("Houve um erro ao enviar o seu pedido. Por favor, tente novamente.");
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane mr-2"></i>Enviar Pedido de Orçamento`;
            });
        }
    </script>
</body>
</html>
